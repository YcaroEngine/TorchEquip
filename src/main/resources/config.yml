# TorchEquip Configuration
# File location: plugins/TorchEquip/config.yml

# When true, deletes the old TorchEquip.mcpack on startup/reload and generates a new one with current settings
auto-generate-geyser-pack: true

# Default torches and lanterns allowed in the off-hand
default-items:
  - TORCH
  - SOUL_TORCH
  - REDSTONE_TORCH
  - COPPER_TORCH
  - LANTERN
  - SOUL_LANTERN
  - COPPER_LANTERN

# Add any extra original Minecraft item names anywhere below using: New = ITEM_NAME
extra-items:
# Examples:
# New = BLAZE_ROD
# New = GLOWSTONE
